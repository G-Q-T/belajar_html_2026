<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir penginputan</title>
    <style>
        body {
            background-color: azure;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px;


        }

        .container {
            box-shadow: 0 4px 10px rgb(0, 0, 0, 1);
            background-color: aqua;
            padding: 40px;
            border-radius: 8px;
            /* margin: 0 25% 0 25%; */
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin: 10px;
            padding: 2px;
            /* display: flex;
            flex-direction: column; */

        }

        .form-group>label {
            color: rgb(0, 0, 0);
            font-family: 'Courier New', Courier, monospace;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 2px;
            border: 1px solid #332d2d;
        }

        input[type="checkbox"] {
            /* display: flex ; */
            /* flex-direction: coloumn;             */
            max-width: 100%;
            /* margin: 0 auto; */

        }

        .gender-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 5px;

        }

        .gender-item,
        .checkbox-item {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
        }

        button[type="submit"] {
            background-color: green;
            color: antiquewhite;
            font-size: 15px;
            cursor: pointer;
        }

        button[type="reset"] {
            background-color: red;
            color: antiquewhite;
            font-size: 15px;
            border-radius: 2px solid;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: rgb(13, 170, 8);

        }

        button[type="reset"]:hover {
            background-color: rgb(163, 3, 3);
        }

        #judul {
            font-size: 30px;
            color: rgb(30, 31, 28);

        }

        #garis {
            color: rgb(0, 0, 0);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="judul">Formulir Pendafataran</h1>
        <p>ini formulir pendaftaran berikut</p>
        <hr id="garis">
        <form action="" method="post">
            <!-- bagian nama -->
            <div class="form-group">
                <label for="name">Nama Lengkap:</label>
                <input type="text" id="name" placeholder="masukan nama lengkap">

            </div>
            <!-- bagian nomor telp -->
            <div class="form-group">

                <label for="number">No Telp/Hp:</label>
                <Input type="text" placeholder="masukan nomor telepon/hp"></Input>

            </div>
            <!-- bagian tanggal lahir -->
            <div class="form-group">

                <label for="date">masukan tanggal lahir:</label>
                <input type="date" name="" id="">

            </div>
            <!-- bagian hobi -->
            <div class="form-group">
                <div class="checkbox-group">
                    <label for="hobi">hobi:</label>
                    <label for="" class="checkbox-item">
                        <input type="checkbox" name="hobi[]" id="">berenang
                    </label>

                    <label for="" class="checkbox-item">
                        <input type="checkbox" name="hobi[]" id="">bersepeda
                    </label>
                    <label for="" class="checkbox-item">
                        <input type="checkbox" name="hobi[]" id="">berselancar
                    </label>
                </div>


            </div>

            <!-- bagian radio button  -->
            <div class="form-group">
                <div class="gender-group">
                    <label for="gender">gender:</label>
                    <label for="
                    " class="gender-item">
                        <input type="radio" name="gender" id="" class="gender-item">laki-laki</label>
                    <label for="" class="gender-item">
                        <input type="radio" name="gender" id="">perempuan
                    </label>
                </div>

            </div>

            <!-- bagian jurusan -->
            <div class="form-group">

                <label for="jurusan">jurusan:</label>

                <select name="jurusan" id="">
                    <option value="">Pilih Jurusan</option>
                    <option value="Teknologi Informasi">Teknologi Informasi</option>
                    <option value="Sistem informasi">Sistem informasi</option>
                    <option value="Teknik Mesin">Teknik Mesin</option>
                </select>

            </div>
            <!-- bagian upload foto -->
            <div class="form-group">

                <label for="file">upload foto</label>

                <input type="file" name="foto" id="">
            </div>
            <!-- bagian alamat -->
            <div class="form-group">

                <label for="alamat">Alamat</label>
                <textarea name="alamat" id="" cols="30" rows="5" placeholder="masukan alamat lengkap"></textarea>
            </div>

            <!-- bagian button -->
            <div class="form-group-button">

                <button type="submit">kirim</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
    
</body>

</html>
